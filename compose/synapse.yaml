services:
  synapse:
    image: matrixdotorg/synapse:latest

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_DOMAIN}
      SYNAPSE_REPORT_STATS: "no"

    volumes:
      - ${PROJECT_DIR}/data/synapse:/data

    networks:
      - matrix
