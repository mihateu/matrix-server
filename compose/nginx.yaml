services:
  nginx:
    image: nginx:1.28-alpine

    restart: unless-stopped

    depends_on:
      - synapse

    ports:
      - "${HTTPS_PORT}:443"
      - "8448:8448"

    volumes:
      - ${PROJECT_DIR}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PROJECT_DIR}/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - matrix
