services:
  livekit:
    image: livekit/livekit-server:latest

    restart: unless-stopped

    command: --config /etc/livekit/livekit.yaml

    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

    volumes:
      - ${PROJECT_DIR}/data/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro

    networks:
      - matrix
